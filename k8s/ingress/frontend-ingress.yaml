apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: weather-app-frontend-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: weatherapp.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80