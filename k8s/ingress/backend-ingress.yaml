apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-app-backend-ingress

spec:
  ingressClassName: nginx
  rules:
    - host: weatherapp.test
      http:
        paths:
          - path: /backend
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000