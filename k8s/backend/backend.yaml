apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: weatherapp-backend:1.1.k8s.prod
        imagePullPolicy: Never

        envFrom:
          - secretRef:
              name: backend-secret
        env: 
          - name: ROCKET_ADDRESS
            value: 0.0.0.0
          - name: FRONTEND_KUBER_URL
            value: "http://weatherapp.test"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000

