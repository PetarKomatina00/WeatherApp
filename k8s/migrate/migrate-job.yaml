apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-job
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 50
  template:
    spec:
      containers:
      - name: migrate-job
        image: weatherapp-migrate:latest
        imagePullPolicy: Never
        command: 
          - diesel
        args:
          - migration
          - run
        env: 
          - name: DATABASE_URL
            valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL
      restartPolicy: Never
