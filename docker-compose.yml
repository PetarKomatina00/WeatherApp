services:
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile 
      target: development
    volumes:
      - ./shared:/app/shared
      - ./backend:/app/backend
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    environment: 
      - ROCKET_DATABASES={postgres={url=postgres://postgres:password@postgres:5432/weather_app_db}}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile 
      target: development
    volumes:
      - ./shared:/app/shared  
      - ./frontend:/app/frontend
    ports:
      - "8001:8001"
    environment:
      - TRUNK_WATCH_USE_POLLING=true
  python_claude:
    build:
      context: ./python_claude
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./python_claude/.env
    volumes:
      - ./python_claude:/app
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_SERVER_URL: "http://mcp_weather:8003/mcp"
    depends_on:
      - mcp_weather
  mcp_weather:
    build:
      context: ./mcp_weather
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./mcp_weather/.env
    volumes:
      - ./mcp_weather:/app
  postgres:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password 
      - POSTGRES_DB=weather_app_db
    ports:
      - "5432:5432"
  redis:
    image: redis:latest 
    ports:
      - 6379:6379
